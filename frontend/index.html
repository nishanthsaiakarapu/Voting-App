<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voter Turnout Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Voter Turnout Prediction</h1>

    <p class="subtitle">
        Predict whether a voter will vote
    </p>

    <label>Age</label>
    <input type="number" id="age" placeholder="Enter age">

    <label>Gender</label>
    <select id="gender">
        <option value="1">Male</option>
        <option value="0">Female</option>
    </select>

    <label>Household Size</label>
    <input type="number" id="household" placeholder="Enter household size">

    <label>Distance from Polling Booth (km)</label>
    <input type="number" step="0.01" id="distance" placeholder="Enter distance">

    <button onclick="predict()">Predict</button>

    <div id="result"></div>

</div>


<script>

async function predict() {

    const age = document.getElementById("age").value;
    const gender = document.getElementById("gender").value;
    const household = document.getElementById("household").value;
    const distance = document.getElementById("distance").value;

    const result = document.getElementById("result");

    if (!age || !household || !distance) {
        result.innerHTML = "Please fill all fields.";
        result.className = "error";
        return;
    }

    result.className = "";
    result.innerHTML = "Predicting...";

    try {

        const response = await fetch("http://127.0.0.1:8001/predict", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                age: Number(age),
                gender: Number(gender),
                household_size: Number(household),
                distance: Number(distance)
            })

        });

        const data = await response.json();

        result.innerHTML = "Prediction: " + data.status;

    } catch (error) {

        result.innerHTML = "Could not connect to backend.";
        result.className = "error";

    }
}

</script>

</body>
</html>
